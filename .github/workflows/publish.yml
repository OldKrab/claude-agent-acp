name: Publish and Release

on:
  push:
    branches:
      - main
  # Bootstrap and recovery path: publishes a ref whose npm publish did not land.
  # See docs/RELEASES.md.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
        type: string

permissions: {}

jobs:
  # Every push to main re-computes the next version from the conventional commit
  # messages and keeps a single release PR open. Merging that PR is what tags,
  # releases and publishes; there is no manual release button.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: release # Optional: for enhanced security
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-please-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          # Do not add release-type here. The action ignores config-file whenever
          # release-type is set, which would silently drop the component tag used
          # to keep OpenAIDE releases distinct from inherited upstream tags. The
          # node release type is declared in that config instead.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # The gate for both paths: nothing is published unless this passes. Its `if`
  # rather than `needs` alone decides whether a release is happening, because on
  # workflow_dispatch the release-please job is skipped.
  verify:
    needs: [release-please]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  publish-npm:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release # Optional: for enhanced security
    permissions:
      contents: read
      id-token: write # npm trusted publishing after the bootstrap release
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # The bootstrap release uses NPM_TOKEN. After the package exists, configure
      # npm Trusted Publishing for this workflow and remove the secret; OIDC then
      # authenticates later releases without a long-lived publish token.
      # prepublishOnly builds the package.
      - name: Publish
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npm publish --access public
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The fork's counterpart of upstream's agent registry update: OpenAIDE pins one
  # exact adapter version, so each publish asks it to open the pin update PR.
  trigger-openaide-update:
    name: Request the OpenAIDE pin update
    needs: publish-npm
    if: ${{ always() && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    # npm metadata is normally visible within about five minutes. Leave 2.5x that
    # window for propagation, plus enough time to mint the token and dispatch.
    timeout-minutes: 15
    steps:
      - name: Wait for package to become available
        env:
          PACKAGE: "@openaide/claude-agent-acp"
          VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::The publish job did not report a package version."
            exit 1
          fi

          deadline=$((SECONDS + 750))
          while (( SECONDS < deadline )); do
            if timeout 10s npm pack "$PACKAGE@$VERSION" \
              --dry-run \
              --ignore-scripts \
              --silent \
              --registry=https://registry.npmjs.org \
              --prefer-online \
              --fetch-retries=0 >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is available from npm."
              exit 0
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              echo "Waiting for $PACKAGE@$VERSION to become available (${remaining}s remaining)..."
              sleep 10
            fi
          done

          echo "::error::$PACKAGE@$VERSION was not available from npm after 12.5 minutes."
          exit 1

      # The shared release App is also installed on OpenAIDE; scope the token to
      # that repository and inherit the installation's permission policy.
      - name: Generate token scoped to OpenAIDE
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: openaide-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: OpenAIDE

      - name: Dispatch the pin update
        env:
          GH_TOKEN: ${{ steps.openaide-token.outputs.token }}
          VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          gh workflow run update-claude-acp.yml \
            --repo "${{ github.repository_owner }}/OpenAIDE" \
            --ref main \
            -f version="$VERSION"
