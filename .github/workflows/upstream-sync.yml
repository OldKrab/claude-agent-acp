name: Upstream Sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: agentclientprotocol/claude-agent-acp

jobs:
  open-update:
    name: Open an upstream release PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate repository token
        id: repository-token
        # Match the other release workflows: the shared App installation owns
        # its permission policy, and rejects a separately narrowed token request.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # App-authored pull requests trigger the ordinary pull_request CI workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"

      - name: Find the latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected upstream release tag: $tag" >&2
            exit 1
          fi

          branch="shushakov/sync-upstream-${tag}"
          tracked="$(jq -r '.openaideUpstream // empty' package.json)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if [[ "$tracked" == "${UPSTREAM_REPOSITORY}@${tag}" ]]; then
            echo "The fork already records ${UPSTREAM_REPOSITORY}@${tag}"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch only the immutable release tag. The namespaced ref cannot
          # collide with the fork's independent release tags.
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" \
            "refs/tags/${tag}:refs/upstream-releases/${tag}"
          commit="$(git rev-parse "refs/upstream-releases/${tag}^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          # Sync PRs are squash-merged, so git cannot find the common ancestor;
          # the release the fork last recorded is it.
          base_tag="${tracked#"${UPSTREAM_REPOSITORY}@"}"
          if [[ -n "$tracked" && "$base_tag" != "$tracked" ]]; then
            git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              "refs/tags/${base_tag}:refs/upstream-releases/${base_tag}"
            echo "base=$(git rev-parse "refs/upstream-releases/${base_tag}^{commit}")" >> "$GITHUB_OUTPUT"
          fi

          if git merge-base --is-ancestor "$commit" HEAD; then
            echo "Upstream ${tag} is already in the fork history"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release branch
        if: steps.release.outputs.required == 'true'
        id: publish-branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          BASE_COMMIT: ${{ steps.release.outputs.base }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --head "$BRANCH" --state all --json number,state --jq '.[0] // empty')"
          if [[ -n "$existing_pr" && "$(jq -r .state <<< "$existing_pr")" != "OPEN" ]]; then
            echo "A closed pull request already tracks this release; respecting that decision"
            exit 0
          fi
          fork_head="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)"
          if [[ -n "$remote_commit" && "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/upstream-update"
            prepared_release="$(git show -s --format='%(trailers:key=Upstream-Sync-Release,valueonly)' "$remote_commit")"
            prepared_base="$(git show -s --format='%(trailers:key=Upstream-Sync-Base,valueonly)' "$remote_commit")"
            committer="$(git show -s --format=%ce "$remote_commit")"
            if [[ "$prepared_release" != "$RELEASE_COMMIT" || -z "$prepared_base" || "$committer" != 'github-actions[bot]@users.noreply.github.com' ]]; then
              echo "Preserving a branch with maintainer edits"
              exit 0
            fi
            if [[ "$prepared_base" == "$fork_head" && -n "$existing_pr" ]]; then
              echo "The update PR already includes the current main"
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          result=0
          node scripts/prepare-upstream-sync.mjs \
            --release "$RELEASE_COMMIT" \
            ${BASE_COMMIT:+--base "$BASE_COMMIT"} \
            --tag "$TAG" \
            --branch "$BRANCH" || result=$?

          if [[ "$result" == "2" ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream conflicts need maintainer resolution; the update will be a draft PR"
            # Preserve an existing prepared branch. For a new conflict, the raw
            # release makes GitHub show the real conflicts without committing markers.
            if [[ -z "$remote_commit" ]]; then
              git switch --detach "$RELEASE_COMMIT"
            fi
          elif [[ "$result" != "0" ]]; then
            exit "$result"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$result" == "0" || -z "$remote_commit" ]]; then
            # Only a branch with our preparation trailers is regenerated. The
            # exact lease also protects edits arriving during this run.
            git push --force-with-lease="refs/heads/${BRANCH}:${remote_commit}" \
              origin "HEAD:refs/heads/${BRANCH}"
          fi
          if [[ -n "$existing_pr" ]]; then
            echo "existing_pr=$(jq -r .number <<< "$existing_pr")" >> "$GITHUB_OUTPUT"
          fi
          echo "update_pr=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the update pull request
        if: steps.publish-branch.outputs.update_pr == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ steps.publish-branch.outputs.draft }}
          EXISTING_PR: ${{ steps.publish-branch.outputs.existing_pr }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$EXISTING_PR" ]]; then
            current_draft="$(gh pr view "$EXISTING_PR" --json isDraft --jq .isDraft)"
            if [[ "$DRAFT" == "true" && "$current_draft" != "true" ]]; then
              gh pr ready "$EXISTING_PR" --undo
            elif [[ "$DRAFT" != "true" && "$current_draft" == "true" ]]; then
              gh pr ready "$EXISTING_PR"
            fi
            exit 0
          fi

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<EOF
          Tracks the exact [upstream ${TAG} release](https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${TAG}).

          The daily sync prepares the immutable upstream release against current main, preserving the \`@openaide/claude-agent-acp\` package identity and fork-owned release files. Automation refreshes its own branch as main advances and stops rewriting it after maintainer commits.

          A draft means source or dependency conflicts need manual resolution. Its branch may point at the raw upstream release: resolve the conflicts and preserve the fork package identity and release files before marking ready. A closed PR suppresses recreation for that tag. If a newer upstream release arrives before this PR merges, its update PR closes this one as superseded; a branch with maintainer commits is kept.

          The normal pull-request CI suite validates prepared merges. Review the release impact and use a release-triggering conventional title before merging when a package release is intended.
          EOF

          draft_args=()
          if [[ "$DRAFT" == "true" ]]; then draft_args+=(--draft); fi
          gh pr create \
            "${draft_args[@]}" \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync upstream ${TAG}" \
            --body-file "$body"

      # Like Dependabot, the update PR for the newest release replaces unmerged
      # update PRs for older releases, because the newer release already contains
      # their upstream changes. Runs whenever that PR is open, so an older PR is
      # also closed on days the newest branch is kept for maintainer edits.
      - name: Close update pull requests for older releases
        if: steps.release.outputs.required == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          current_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$current_pr" ]]; then
            echo "No open update PR for ${TAG}; older update PRs are left open"
            exit 0
          fi

          # Commits already on main don't count as maintainer work on a branch.
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"

          prefix="shushakov/sync-upstream-"
          rows="$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"${prefix}\")) | \"\(.number) \(.headRefName)\"")"

          # fd 3 keeps gh and git from consuming the PR list on stdin.
          while read -r number branch <&3; do
            if [[ -z "$number" || "$branch" == "$BRANCH" ]]; then continue; fi
            tag="${branch#"$prefix"}"
            # Only older releases are superseded; sort -V puts v0.9.0 before v0.10.0.
            if [[ "$(printf '%s\n%s\n' "$tag" "$TAG" | sort -V | head -n 1)" != "$tag" ]]; then
              echo "Keeping #${number}: ${tag} is newer than ${TAG}"
              continue
            fi

            # Delete only branches holding nothing but automation output. Leaving
            # out commits already on main or in the newer upstream release, what
            # remains is the sync merge committed by github-actions[bot] (nothing
            # at all for a conflicted draft that points at the raw release),
            # unless a maintainer pushed work such as conflict fixes.
            head="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"
            delete_branch=false
            if [[ -n "$head" ]]; then
              git fetch --no-tags --quiet origin "refs/heads/${branch}"
              maintainer_commits="$(git log --format=%ce "$head" ^refs/remotes/origin/main "^${RELEASE_COMMIT}" |
                grep -cvxF 'github-actions[bot]@users.noreply.github.com' || true)"
              if [[ "$maintainer_commits" == "0" ]]; then delete_branch=true; fi
            fi

            comment="Superseded by #${current_pr}, which tracks upstream ${TAG}."
            if [[ -n "$head" && "$delete_branch" == "false" ]]; then
              comment+=" The \`${branch}\` branch has maintainer commits, so it is kept."
            fi
            gh pr close "$number" --comment "$comment"

            branch_outcome="kept"
            if [[ "$delete_branch" == "true" ]]; then
              # The lease skips the delete if someone pushed after the check above.
              if git push --quiet --force-with-lease="refs/heads/${branch}:${head}" origin ":refs/heads/${branch}"; then
                branch_outcome="deleted"
              else
                branch_outcome="delete_failed"
                echo "::warning::Closed #${number} but could not delete ${branch}"
              fi
            fi
            echo "Closed #${number} (${tag}) as superseded by #${current_pr} (${TAG}); branch ${branch_outcome}"
          done 3<<< "$rows"
